    <script>

            .split("&")[0]
            .replace(/\~and\~/g, "&");

            ? l.pathname.slice(0, -1)
            : l.pathname;

          window.history.replaceState(
            null,
            null,
            base + path + l.hash
          );
        }
      })(window.location);
